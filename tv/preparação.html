<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haiala | PREPARAÇÃO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#17202a}
body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
header{background:#111820;color:#fff;display:grid;grid-template-columns:300px 1fr 300px;align-items:center;padding:10px 28px 8px;border-bottom:6px solid #d71920;gap:16px;min-height:112px}
.logo-box{display:inline-flex;align-items:center;justify-content:center;background:#fff;padding:8px 12px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.18);width:max-content;max-width:100%}
.logo{height:66px;max-width:240px;object-fit:contain;display:block}
.head-center{text-align:center;min-width:0}
.head-center .kicker{font-size:17px;letter-spacing:2px;text-transform:uppercase;opacity:.72;line-height:1.1}
.head-center h1{font-size:34px;line-height:1.05;margin:4px 0 0;font-weight:800}
.head-center h1 span{color:#ff3138}
.clock{text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px}
.clock .date{font-size:18px;font-weight:700;line-height:1.1}
.clock .time{font-size:34px;font-weight:800;line-height:1}
.clock .refresh{font-size:12px;opacity:.78;line-height:1.1;margin-top:2px}

main{flex:1;padding:18px 24px 14px;overflow:hidden;display:flex;flex-direction:column}
.board-shell{flex:1;background:#ffffff;border:1px solid #d9dfe6;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px 14px 10px;display:flex;flex-direction:column;overflow:hidden}
.board-title{text-align:center;font-size:34px;font-weight:300;letter-spacing:5px;color:#4a5563;margin:4px 0 12px;text-transform:uppercase}
.board-wrap{flex:1;overflow:hidden;border:2px solid #d04a4a;border-radius:8px}
.board-table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
.board-table thead th{border:2px solid #d96b6b;background:#fff;color:#374151;padding:8px 6px;text-align:center;vertical-align:middle}
.board-table thead th .col-main{display:block;font-size:18px;font-weight:800;line-height:1.05}
.board-table thead th .col-sub{display:block;font-size:12px;font-weight:700;line-height:1.05;margin-top:3px;text-transform:uppercase}
.board-table thead th.seq-head .col-main{font-size:15px}
.board-table tbody td{border:2px solid #ea9b9b;vertical-align:top;padding:4px;background:#fff}
.board-table tbody td.seq-cell{text-align:center;font-size:28px;font-weight:800;color:#3d3d3d;vertical-align:middle;padding:0}
.board-table tbody tr{height:10%}
.seq-col{width:7%}
.machine-col{width:18.6%}

.cell-stack{display:flex;flex-direction:column;gap:4px;height:100%;overflow:hidden}
.cell-placeholder{color:#c5cbd3;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;height:100%}
.kit-card{border:1px solid #ced6de;border-radius:6px;background:#fbfcfd;padding:5px 6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kit-op{font-size:12px;font-weight:800;color:#1f3147;line-height:1.15}
.kit-product{font-size:11px;color:#3f4a57;line-height:1.18;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kit-meta{display:flex;justify-content:space-between;gap:6px;margin-top:4px;font-size:10px;font-weight:700;color:#6b7280}.kit-card-simple{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 6px;gap:3px}.kit-line{font-size:11px;font-weight:800;color:#1f3147;line-height:1.2;text-align:center;white-space:normal}.kit-line-sku{font-size:11px}.kit-line-op{font-size:11px}
.final-box{font-size:15px;font-weight:800;color:#1f3147;text-align:center;padding-top:10px}
.final-box small{display:block;font-size:11px;color:#6b7280;font-weight:700;margin-top:3px}

.note-bar{margin-top:8px;font-size:12px;color:#6b7280;text-align:right}

footer{height:7vh;min-height:52px;background:#111820;color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 32px;font-size:16px}
.foot-center{font-size:21px;font-weight:800;letter-spacing:1px}
.foot-right{text-align:right;color:#aeb7c1}
.home{color:#fff;text-decoration:none;font-weight:700}

@media(max-width:1400px){
  .board-title{font-size:28px;letter-spacing:4px}
  .board-table thead th .col-main{font-size:16px}
  .board-table tbody td.seq-cell{font-size:24px}
  .kit-op{font-size:11px}
  .kit-product{font-size:10px}
}
@media(max-width:1100px){
  header{grid-template-columns:220px 1fr 220px;padding:10px 20px 8px}
  .logo{height:58px;max-width:180px}
  .head-center h1{font-size:28px}
  .head-center .kicker{font-size:14px}
  .clock .date{font-size:15px}
  .clock .time{font-size:28px}
  .board-title{font-size:24px;letter-spacing:3px}
}
</style>
</head>

      <td><div class="cell-stack" id="m2-${i}"><div class="cell-placeholder"></div></div></td>
      <td><div class="cell-stack" id="m6-${i}"><div class="cell-placeholder"></div></div></td>
      <td><div class="cell-stack" id="m1-${i}"><div class="cell-placeholder"></div></div></td>
      <td><div class="cell-stack" id="m5-${i}"><div class="cell-placeholder"></div></div></td>
      <td><div class="cell-stack" id="m3-${i}"><div class="cell-placeholder"></div></div></td>
    `;
    body.appendChild(tr);
  }
}

function cardKit(item){
  const codigo = item.codigo ?? '';
  const sku = item.sku ?? '';
  const op = item.op ?? '';
  const quantidade = item.quantidade ?? '';
  const tpKit = item.tp_kit ?? '';
  const tpTotal = item.tp_total ?? '';

  return `
    <div class="kit-card kit-card-simple">
      <div class="kit-line kit-line-sku">
        COD: ${codigo} - ${sku}
      </div>
      <div class="kit-line kit-line-op">
        OP ${op} - Qte ${quantidade} - Tp Kit ${tpKit} Min - Tp Total ${tpTotal} Min
      </div>
    </div>
  `;
}

function preencherColuna(id, itens){
  const el = document.getElementById(id);
  if(!el) return;
  if(!Array.isArray(itens) || itens.length === 0){
    el.innerHTML = '<div class="cell-placeholder"></div>';
    return;
  }
  el.innerHTML = itens.map(cardKit).join('');
}

function renderizarPlano(dados){
  montarLinhasVazias();

  if(!Array.isArray(dados)) return;

  dados.forEach(linha => {
    const seq = Number(linha.sequencia ?? 0);
    if(!seq || seq < 1 || seq > 10) return;

    preencherColuna(`m2-${seq}`, linha.m2);
    preencherColuna(`m6-${seq}`, linha.m6);
    preencherColuna(`m1-${seq}`, linha.m1);
    preencherColuna(`m5-${seq}`, linha.m5);
    preencherColuna(`m3-${seq}`, linha.m3);
  });
}


function carregarDemoVisual(){
  renderizarPlano([
    {
      sequencia: 1,
      m2: [{codigo:'111', sku:'P VEN EXTRA 085X215 DIR REQ12', op:'95645', quantidade:'02', tp_kit:'2,5', tp_total:'5,0'}],
      m6: [{codigo:'111', sku:'P VEN EXTRA 085X215 DIR REQ12', op:'95645', quantidade:'02', tp_kit:'2,5', tp_total:'5,0'}],
      m1: [{codigo:'111', sku:'P VEN EXTRA 085X215 DIR REQ12', op:'95645', quantidade:'02', tp_kit:'2,5', tp_total:'5,0'}],
      m5: [{codigo:'111', sku:'P VEN EXTRA 085X215 DIR REQ12', op:'95645', quantidade:'02', tp_kit:'2,5', tp_total:'5,0'}],
      m3: [{codigo:'111', sku:'P VEN EXTRA 085X215 DIR REQ12', op:'95645', quantidade:'02', tp_kit:'2,5', tp_total:'5,0'}]
    }
  ]);
}

async function carregarPlano(){
  try {
    const resp = await fetch('api/ordens-centro.php?centro=PREPARACAO', { cache: 'no-store' });
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();

    if(json && json.sucesso === true && Array.isArray(json.dados) && json.dados.length > 0){
      renderizarPlano(json.dados);
    }
  } catch(e) {
    console.error('Falha ao carregar plano de preparação:', e);
    // Mantém os dados demonstrativos já exibidos na tela.
  }
}

montarLinhasVazias();
carregarDemoVisual();
carregarPlano();
setInterval(carregarPlano, 60000);
</script>
